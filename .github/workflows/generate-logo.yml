name: Generate logo

on:
  push:
    paths:
      - .github/workflows/generate-logo.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet pillow

      - name: Render idle GIF
        run: |
          python - <<'PY'
          from PIL import Image

          sheet = Image.open("assets/spritesheet.webp").convert("RGBA")
          cell_w, cell_h = 192, 208
          frames = [
              sheet.crop((i * cell_w, 0, (i + 1) * cell_w, cell_h))
              for i in range(7)
          ]

          frames[0].save(
              "assets/logo.gif",
              save_all=True,
              append_images=frames[1:],
              duration=200,
              loop=0,
              disposal=2,
              optimize=True,
          )
          PY

      - name: Commit logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo.gif
          git diff --cached --quiet && exit 0
          git commit -m "生成蓝鲸女仆动图 logo"
          git push
